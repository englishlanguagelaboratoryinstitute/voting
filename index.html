<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ell Grand Debate Stage Projection Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* ── LOGO — paste your image URL here ── */
      --logo-url: "YOUR_LOGO_URL_HERE";

      /* ── BRAND PALETTE: forest green / gold / white / black ── */
      --bg-main:      #f7f6f2;   /* warm off-white */
      --bg-deep:      #0b1410;   /* near-black, used for hero-style depth */
      --card-bg:      #ffffff;
      --primary:      #0b3d2e;   /* forest green */
      --primary-light:#145c41;
      --accent:       #d4af37;   /* gold */
      --accent-light: #e8cb6b;
      --orange:       #c97a2b;   /* orange/gold support tone */
      --text-main:    #0f1c16;
      --text-muted:   #5c6b62;
      --border:       #e1e6df;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'DM Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    .slide-container { width: 100%; height: 100%; position: relative; }
    .slide {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 4rem;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease;
      background:
        radial-gradient(circle at 12% 12%, rgba(212,175,55,0.07), transparent 40%),
        radial-gradient(circle at 88% 90%, rgba(11,61,46,0.05), transparent 40%);
    }
    .slide.active { opacity: 1; visibility: visible; }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.2rem;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--primary);
      animation: riseIn 0.7s ease both;
    }
    h2 {
      font-size: 1.7rem;
      color: var(--orange);
      margin-bottom: 2rem;
      font-weight: 600;
      animation: riseIn 0.7s 0.1s ease both;
    }

    .qr-box {
      background: white;
      padding: 1.5rem;
      border-radius: 1rem;
      box-shadow: 0 16px 40px rgba(11,61,46,0.18), 0 0 0 1px var(--border);
      margin-bottom: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: cardUp 0.6s 0.2s ease both;
      position: relative;
    }
    .qr-box::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 1.1rem;
      background: linear-gradient(135deg, var(--accent), var(--primary), var(--accent));
      z-index: -1;
      opacity: 0.5;
    }
    .qr-box img { width: 300px; height: 300px; display: block; }
    .instructions {
      font-size: 1.5rem;
      color: var(--text-muted);
      max-width: 800px;
      animation: riseIn 0.7s 0.3s ease both;
    }

    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      width: 100%;
      max-width: 1200px;
      margin-top: 1rem;
    }
    .chart-section {
      background: var(--card-bg);
      border-radius: 1rem;
      padding: 2rem;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(11,61,46,0.07);
      animation: cardUp 0.5s ease both;
      position: relative;
      overflow: hidden;
    }
    .chart-section h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 0.5rem;
      text-align: left;
      color: var(--primary);
    }
    .bar-container { margin-bottom: 1.4rem; text-align: left; animation: barIn 0.45s ease both; }
    .bar-label { display: flex; justify-content: space-between; font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--text-main); }
    .bar-label strong { color: var(--primary); }
    .bar-bg { background: #eef1ec; height: 32px; border-radius: 6px; overflow: hidden; position: relative; }
    .bar-fill {
      background: linear-gradient(90deg, var(--primary) 0%, var(--primary-light) 100%);
      height: 100%;
      width: 0%;
      border-radius: 6px;
      transition: width 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    /* subtle moving sheen while value settles */
    .bar-fill::after {
      content: '';
      position: absolute;
      top: 0; left: -60%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(212,175,55,0.45), transparent);
      animation: sheen 1.8s ease-in-out infinite;
    }

    .total-votes {
      font-size: 0.95rem;
      color: var(--text-muted);
      text-align: right;
      margin-bottom: 1rem;
    }

    /* subtle pulsing dot to show live polling is active */
    .live-pulse {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 6px;
      animation: pulseDot 1.6s ease-in-out infinite;
      vertical-align: middle;
    }

    .controls-hint {
      position: absolute;
      bottom: 1rem; right: 1rem;
      font-size: 0.85rem; color: var(--text-muted);
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--border);
      backdrop-filter: blur(6px);
      padding: 0.3rem 0.7rem; border-radius: 4px;
    }
    .slide-counter {
      position: absolute;
      bottom: 1rem; left: 1rem;
      font-size: 0.85rem; color: var(--text-muted);
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--border);
      backdrop-filter: blur(6px);
      padding: 0.3rem 0.7rem; border-radius: 4px;
    }

    /* logo corner mark */
    .brand-mark {
      position: absolute;
      top: 1rem; left: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 50;
      text-decoration: none;
    }
    .brand-mark .logo-img {
      width: 136px; height: 136px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
      background: var(--primary);
    }
    .brand-mark .logo-fallback {
      width: 136px; height: 136px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 52px;
      display: none;
      align-items: center;
      justify-content: center;
      border: 3px solid var(--accent);
    }
    .brand-mark .brand-name {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--primary);
      letter-spacing: 0.02em;
    }

    .empty-msg { font-size: 1.1rem; color: var(--text-muted); padding: 2rem 0; text-align: left; }

    .api-warning {
      position: fixed;
      top: 1rem; left: 50%; transform: translateX(-50%);
      background: #fdeee8; color: #9a3b1f;
      border: 1px solid #f3cbb8;
      padding: 0.5rem 1.5rem; border-radius: 6px;
      font-size: 0.95rem; display: none; z-index: 999;
    }

    /* ── ANIMATIONS ── */
    @keyframes riseIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes cardUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
    @keyframes barIn  { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:translateX(0); } }
    @keyframes sheen  { 0% { left:-60%; } 100% { left:130%; } }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.75); }
    }

    /* ─── SPLASH SCREEN ──────────────────────────────── */
    .slide[data-type="splash"] {
      background:
        radial-gradient(circle at 20% 25%, rgba(212,175,55,0.16), transparent 50%),
        radial-gradient(circle at 80% 75%, rgba(11,61,46,0.5), transparent 55%),
        linear-gradient(160deg, var(--bg-deep) 0%, var(--primary) 140%);
      color: #fff;
    }
    .splash-hero-img {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid var(--accent);
      box-shadow: 0 0 0 8px rgba(212,175,55,0.12), 0 20px 60px rgba(0,0,0,0.4);
      margin-bottom: 2.2rem;
      animation: popIn 0.7s cubic-bezier(.175,.885,.32,1.275) both;
    }
    .splash-eyebrow {
      font-size: 0.95rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-light);
      margin-bottom: 0.6rem;
      animation: riseIn 0.7s 0.1s ease both;
    }
    .splash-title {
      font-family: 'Playfair Display', serif;
      font-size: 3.4rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 0.8rem;
      animation: riseIn 0.7s 0.2s ease both;
    }
    .splash-sub {
      font-size: 1.3rem;
      color: rgba(255,255,255,0.78);
      margin-bottom: 2.4rem;
      animation: riseIn 0.7s 0.3s ease both;
    }
    .splash-prompt {
      font-size: 1rem;
      color: var(--accent-light);
      padding: 0.7rem 1.6rem;
      border: 1.5px solid var(--accent);
      border-radius: 30px;
      animation: pulsePrompt 1.8s ease-in-out infinite, riseIn 0.7s 0.4s ease both;
    }
    @keyframes pulsePrompt {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    @keyframes popIn {
      from { opacity:0; transform: scale(0.6); }
      to   { opacity:1; transform: scale(1); }
    }

    /* ─── FINALE CAROUSEL ────────────────────────────── */
    .slide[data-type="finale"] {
      background:
        radial-gradient(circle at 15% 20%, rgba(212,175,55,0.12), transparent 45%),
        linear-gradient(165deg, var(--bg-deep) 0%, var(--primary) 130%);
      color: #fff;
      padding: 3rem;
    }
    .finale-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 0.3rem;
    }
    .finale-sub {
      font-size: 1.1rem;
      color: var(--accent-light);
      margin-bottom: 2rem;
    }
    .carousel-viewport {
      width: 100%;
      max-width: 900px;
      position: relative;
      height: 320px;
      overflow: hidden;
    }
    .carousel-track {
      display: flex;
      height: 100%;
      transition: transform 0.7s cubic-bezier(0.65, 0, 0.35, 1);
    }
    .carousel-card {
      flex: 0 0 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0 2rem;
    }
    .carousel-trophy {
      font-size: 3.2rem;
      animation: popIn 0.6s cubic-bezier(.175,.885,.32,1.275) both;
    }
    .carousel-match-label {
      font-size: 0.9rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-light);
    }
    .carousel-winner {
      font-family: 'Playfair Display', serif;
      font-size: 2.3rem;
      color: #fff;
      font-weight: 700;
    }
    .carousel-speaker {
      font-size: 1.05rem;
      color: rgba(255,255,255,0.82);
    }
    .carousel-speaker strong { color: var(--accent); }
    .carousel-dots {
      display: flex;
      gap: 8px;
      margin-top: 1.6rem;
    }
    .carousel-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      transition: background 0.3s, transform 0.3s;
    }
    .carousel-dot.active {
      background: var(--accent);
      transform: scale(1.3);
    }
  </style>
</head>
<body>

  <a class="brand-mark" href="#" target="#" rel="noopener">
    <img src="https://englishlanguagelaboratoryinstitute.github.io/spellingbchampionshipregistration/logo.png" alt="Logo" class="logo-img" id="logoImg" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';">
    <div class="logo-fallback" id="logoFallback">E</div>
    <span class="brand-name"></span>
  </a>

  <div class="api-warning" id="apiWarning">⚠ API URL not configured — edit CONFIG.apiUrl in script</div>
  <div class="slide-container" id="deck"></div>
  <div class="slide-counter" id="slideCounter"></div>
  <div class="controls-hint">← → Arrows / Spacebar to navigate · Enter to advance splash</div>

  <script>
    const CONFIG = {
      apiUrl: "https://script.google.com/macros/s/AKfycbxMA_Tsmp4M24frnIYN1wT6yId0JS0ChyC1c7wW79njy6FvATcS7xcwiT2AQH0ow6dyPQ/exec",

      heroImage: "hero.jpg",

      matches: [
        {
          id: 1,
          name: "Match 1 Session",
          teams: ["TEAM 1", "TEAM 2"],
          formUrl: "https://englishlanguagelaboratoryinstitute.github.io/ell-debate-forms/match1.html"
        },
        {
          id: 2,
          name: "Match 2 Session",
          teams: ["TEAM 3", "TEAM 4"],
          formUrl: "https://englishlanguagelaboratoryinstitute.github.io/ell-debate-forms/match2.html"
        },
        {
          id: 3,
          name: "Match 3 Session",
          teams: ["TEAM 5", "TEAM 6"],
          formUrl: "https://englishlanguagelaboratoryinstitute.github.io/ell-debate-forms/match3.html"
        },
        {
          id: 4,
          name: "Match 4 Session",
          teams: ["TEAM 7", "TEAM 8"],
          formUrl: "https://englishlanguagelaboratoryinstitute.github.io/ell-debate-forms/match4.html"
        },
        {
          id: 5,
          name: "Match 5 Session",
          teams: ["TEAM 9", "TEAM 10"],
          formUrl: "https://englishlanguagelaboratoryinstitute.github.io/ell-debate-forms/match5.html"
        }
      ],

      pollInterval: 3000
    };

    let currentSlideIndex = 0;
    const slideElements = [];
    let pollTimer = null;

    // QR via image API — no external JS library needed
    function getQrImageUrl(text) {
      return `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(text)}`;
    }

    function buildBarsHtml(dataset, total) {
      const keys = Object.keys(dataset);
      if (keys.length === 0) return `<div class="empty-msg">No submissions recorded yet...</div>`;
      let html = `<div class="total-votes">Total votes: ${total}</div>`;
      keys.forEach((key, i) => {
        const votes = dataset[key];
        const pct = total > 0 ? Math.round((votes / total) * 100) : 0;
        html += `
          <div class="bar-container" style="animation-delay:${i * 0.06}s">
            <div class="bar-label">
              <span>${key}</span>
              <strong>${votes} vote${votes !== 1 ? 's' : ''} (${pct}%)</strong>
            </div>
            <div class="bar-bg">
              <div class="bar-fill" data-target="${pct}" style="width:0%"></div>
            </div>
          </div>`;
      });
      return html;
    }

    function renderChart(containerId, titleText, dataset, total) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = `<h3>${titleText}</h3>` + buildBarsHtml(dataset, total);
      // Paint at width:0 first, then animate to target on the next frame
      // so the transition actually plays instead of snapping to final value.
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          container.querySelectorAll('.bar-fill').forEach(bar => {
            bar.style.width = bar.dataset.target + '%';
          });
        });
      });
    }

    function topEntry(dataset) {
      const keys = Object.keys(dataset || {});
      if (keys.length === 0) return null;
      return keys.reduce((best, key) =>
        (dataset[key] > dataset[best] ? key : best), keys[0]);
    }

    async function fetchLiveMetrics() {
      const activeSlide = slideElements[currentSlideIndex];
      if (!activeSlide || activeSlide.dataset.type !== "results") return;

      if (CONFIG.apiUrl === "YOUR_APPS_SCRIPT_WEB_APP_URL") {
        document.getElementById("apiWarning").style.display = "block";
        return;
      }

      const matchId = activeSlide.dataset.matchId;
      try {
        const res = await fetch(`${CONFIG.apiUrl}?cb=${Date.now()}`);
        const data = await res.json();
        const matchData = data[`Match ${matchId}`];
        if (matchData) {
          renderChart(
            `winner-container-${matchId}`,
            "Team Winner Standings",
            matchData.winnerVotes,
            matchData.totalVotes
          );
          renderChart(
            `speaker-container-${matchId}`,
            "Best Speaker Standings",
            matchData.speakerVotes,
            matchData.totalVotes
          );
        }
      } catch (err) {
        console.error("API Fetch Error:", err);
      }
    }

    /* ── Finale carousel ─────────────────────────────── */
    let carouselIndex = 0;
    let carouselTimer = null;
    let carouselData = []; // [{matchName, winner, speaker}]

    function renderCarouselDots() {
      const dotsEl = document.getElementById("carouselDots");
      if (!dotsEl) return;
      dotsEl.innerHTML = carouselData.map((_, i) =>
        `<div class="carousel-dot${i === carouselIndex ? ' active' : ''}"></div>`
      ).join("");
    }

    function moveCarousel(toIndex) {
      const track = document.getElementById("carouselTrack");
      if (!track || carouselData.length === 0) return;
      carouselIndex = ((toIndex % carouselData.length) + carouselData.length) % carouselData.length;
      track.style.transform = `translateX(-${carouselIndex * 100}%)`;
      renderCarouselDots();
    }

    function startCarouselAutoplay() {
      clearInterval(carouselTimer);
      if (carouselData.length <= 1) return;
      carouselTimer = setInterval(() => moveCarousel(carouselIndex + 1), 4000);
    }

    async function loadFinaleData() {
      const track = document.getElementById("carouselTrack");
      if (!track) return;

      if (CONFIG.apiUrl === "YOUR_APPS_SCRIPT_WEB_APP_URL") {
        document.getElementById("apiWarning").style.display = "block";
        return;
      }

      try {
        const res = await fetch(`${CONFIG.apiUrl}?cb=${Date.now()}`);
        const data = await res.json();

        carouselData = CONFIG.matches.map(match => {
          const matchData = data[`Match ${match.id}`] || { winnerVotes: {}, speakerVotes: {} };
          const winner = topEntry(matchData.winnerVotes) || "No votes yet";
          const speaker = topEntry(matchData.speakerVotes) || "No votes yet";
          return { matchName: match.name, winner, speaker };
        });

        track.innerHTML = carouselData.map(item => `
          <div class="carousel-card">
            <div class="carousel-trophy">🏆</div>
            <div class="carousel-match-label">${item.matchName}</div>
            <div class="carousel-winner">${item.winner}</div>
            <div class="carousel-speaker">Best Speaker: <strong>${item.speaker}</strong></div>
          </div>
        `).join("");

        carouselIndex = 0;
        moveCarousel(0);
        startCarouselAutoplay();
      } catch (err) {
        console.error("Finale Fetch Error:", err);
        track.innerHTML = `<div class="carousel-card"><div class="empty-msg" style="color:rgba(255,255,255,0.7)">Could not load results.</div></div>`;
      }
    }

    function updateSlideVisibility() {
      slideElements.forEach((slide, idx) => {
        slide.classList.toggle("active", idx === currentSlideIndex);
      });
      document.getElementById("slideCounter").textContent =
        `Slide ${currentSlideIndex + 1} / ${slideElements.length}`;

      clearInterval(pollTimer);
      clearInterval(carouselTimer);

      const active = slideElements[currentSlideIndex];
      if (active && active.dataset.type === "results") {
        fetchLiveMetrics();
        pollTimer = setInterval(fetchLiveMetrics, CONFIG.pollInterval);
      }
      if (active && active.dataset.type === "finale") {
        loadFinaleData();
      }
    }

    function initDeck() {
      const deck = document.getElementById("deck");

      CONFIG.matches.forEach(match => {
        // — Splash slide —
        const splashSlide = document.createElement("div");
        splashSlide.className = "slide";
        splashSlide.dataset.type = "splash";
        splashSlide.dataset.matchId = match.id;
        splashSlide.innerHTML = `
          <img class="splash-hero-img" src="${CONFIG.heroImage}" alt="" onerror="this.style.display='none'">
          <span class="splash-eyebrow">Up Next</span>
          <h1 class="splash-title">${match.name}</h1>
          <p class="splash-sub">${match.teams.join(" vs ")}</p>
          <span class="splash-prompt">Press Enter or hold Spacebar to continue</span>`;
        deck.appendChild(splashSlide);
        slideElements.push(splashSlide);

        // — QR slide —
        const qrSlide = document.createElement("div");
        qrSlide.className = "slide";
        qrSlide.dataset.type = "qr";
        qrSlide.dataset.matchId = match.id;
        qrSlide.innerHTML = `
          <h1>${match.name}</h1>
          <h2>Scan to Vote</h2>
          <div class="qr-box">
            <img src="${getQrImageUrl(match.formUrl)}" alt="Voting QR Code for ${match.name}">
          </div>
          <div class="instructions">
            Vote for Team Winner &amp; Best Speaker — ${match.teams.join(" vs ")}
          </div>`;
        deck.appendChild(qrSlide);
        slideElements.push(qrSlide);

        // — Results slide —
        const resultsSlide = document.createElement("div");
        resultsSlide.className = "slide";
        resultsSlide.dataset.type = "results";
        resultsSlide.dataset.matchId = match.id;
        resultsSlide.innerHTML = `
          <h1>${match.name}</h1>
          <h2><span class="live-pulse"></span>Real-Time Ballot Metrics</h2>
          <div class="results-grid">
            <div class="chart-section" id="winner-container-${match.id}">
              <h3>Team Winner Standings</h3>
              <div class="empty-msg">No submissions recorded yet...</div>
            </div>
            <div class="chart-section" id="speaker-container-${match.id}">
              <h3>Best Speaker Standings</h3>
              <div class="empty-msg">No submissions recorded yet...</div>
            </div>
          </div>`;
        deck.appendChild(resultsSlide);
        slideElements.push(resultsSlide);
      });

      // — Finale carousel slide —
      const finaleSlide = document.createElement("div");
      finaleSlide.className = "slide";
      finaleSlide.dataset.type = "finale";
      finaleSlide.innerHTML = `
        <h1 class="finale-title">🏆 Champions Showcase 🏆</h1>
        <p class="finale-sub">Every Match Winner &amp; Best Speaker</p>
        <div class="carousel-viewport">
          <div class="carousel-track" id="carouselTrack"></div>
        </div>
        <div class="carousel-dots" id="carouselDots"></div>`;
      deck.appendChild(finaleSlide);
      slideElements.push(finaleSlide);

      updateSlideVisibility();
    }

    window.addEventListener("keydown", e => {
      const active = slideElements[currentSlideIndex];
      const isSplash = active && active.dataset.type === "splash";

      // Splash slides only advance on Enter or Spacebar — arrows are ignored
      // so the deck can't skip past the splash by accident.
      if (isSplash) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          if (currentSlideIndex < slideElements.length - 1) {
            currentSlideIndex++;
            updateSlideVisibility();
          }
        }
        return;
      }

      if (e.key === "ArrowRight" || e.key === " ") {
        if (currentSlideIndex < slideElements.length - 1) {
          currentSlideIndex++;
          updateSlideVisibility();
        }
      } else if (e.key === "ArrowLeft") {
        if (currentSlideIndex > 0) {
          currentSlideIndex--;
          updateSlideVisibility();
        }
      } else if (e.key === "Enter") {
        if (currentSlideIndex < slideElements.length - 1) {
          currentSlideIndex++;
          updateSlideVisibility();
        }
      }
    });

    initDeck();

    // Logo fallback: if placeholder URL wasn't replaced, show monogram instead
    (function(){
      var img = document.getElementById('logoImg');
      var fb  = document.getElementById('logoFallback');
      if (!img || !fb) return;
      if (!img.src || img.src.includes('YOUR_LOGO_URL_HERE')) {
        img.style.display = 'none';
        fb.style.display = 'flex';
      }
    })();
  </script>
</body>
</html>
